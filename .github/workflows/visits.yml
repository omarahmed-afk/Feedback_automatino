name: WebPT visits

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webpt-visits
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HEADLESS: 'true'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Chrome
        run: google-chrome --version
      - name: Export today's visits to Google Sheets
        env:
          WEBPT_USERNAME: ${{ secrets.WEBPT_USERNAME }}
          WEBPT_PASSWORD: ${{ secrets.WEBPT_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python visits.py
